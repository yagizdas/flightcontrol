<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bavul</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-row">
    <div class="app-brand">
      <span class="app-title">bavul</span>
      <span class="app-subtitle">pre-flight checklist</span>
    </div>
    <span class="counter" id="counter"></span>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>
</header>

<main class="sections" id="sections"></main>

<div class="footer">
  <button class="reset-btn" id="reset-btn">Reset checklist</button>
</div>

<button class="help-btn" id="help-btn" aria-label="How it works">?</button>

<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-heading">
  <div class="tutorial">
    <h2 class="tutorial-title" id="tutorial-heading">How it works</h2>

    <div class="tutorial-rows">

      <div class="tutorial-row">
        <div class="demo-card demo-checked">
          <span class="demo-dot demo-dot-check">✓</span>
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action">Tap once</span>
          <span class="row-result">Mark as packed ✓</span>
        </div>
      </div>

      <div class="tutorial-row">
        <div class="demo-card demo-skipped">
          <span class="demo-dot demo-dot-skip">✕</span>
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action">Tap again</span>
          <span class="row-result">Not taking ✕</span>
        </div>
      </div>

      <div class="tutorial-row">
        <div class="demo-card">
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action">Tap once more</span>
          <span class="row-result">Reset to default</span>
        </div>
      </div>

    </div>

    <button class="tutorial-btn" id="tutorial-dismiss">Got it</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
