<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bavul</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧳</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
  <div class="header-row">
    <div class="app-brand">
      <span class="app-title">bavul</span>
      <span class="app-subtitle" data-i18n="subtitle">pre-flight checklist</span>
    </div>
    <div class="header-right">
      <button class="lang-btn" id="lang-btn" aria-label="Switch language">
        <span class="lang-flag" data-lang="tr">🇹🇷</span>
        <span class="lang-sep">|</span>
        <span class="lang-flag" data-lang="en">🇺🇸</span>
      </button>
      <span class="counter" id="counter"></span>
    </div>
  </div>
  <div class="progress-track">
    <div class="progress-fill" id="progress"></div>
  </div>
</header>

<main class="sections" id="sections"></main>

<div class="footer">
  <button class="footer-btn clear-btn" id="clear-btn" data-i18n="clearBtn">Clear</button>
  <button class="footer-btn reset-btn" id="reset-btn" data-i18n="resetBtn">Reset</button>
</div>

<button class="add-fab" id="add-fab" aria-label="Add item"></button>
<button class="help-btn" id="help-btn" aria-label="How it works">?</button>

<div class="overlay add-overlay hidden" id="add-overlay" role="dialog" aria-modal="true" aria-labelledby="add-title">
  <div class="add-sheet">
    <div class="add-sheet-top">
      <div>
        <h2 class="add-title" id="add-title" data-i18n="addTitle">Add item</h2>
        <p class="add-subtitle" data-i18n="addSubtitle">Pick a name and emoji</p>
      </div>
      <button class="add-close" id="add-close" type="button" aria-label="Close">×</button>
    </div>
    <div class="add-panel-head">
      <span class="add-form-title" data-i18n="addFormTitle">New checklist item</span>
      <button class="add-submit" id="add-submit" type="button" data-i18n="addBtn">Add</button>
    </div>
    <div class="add-fields">
      <label class="field-wrap">
        <span data-i18n="nameLabel">Name</span>
        <input id="item-name" type="text" maxlength="28" autocomplete="off" data-i18n-placeholder="namePlaceholder" placeholder="Sunglasses">
      </label>
      <label class="field-wrap emoji-wrap">
        <span data-i18n="emojiLabel">Emoji</span>
        <input id="item-emoji" type="text" maxlength="4" autocomplete="off" inputmode="text" placeholder="🧳" aria-label="Emoji">
      </label>
    </div>
    <div class="emoji-picks" id="emoji-picks" aria-label="Emoji suggestions"></div>
  </div>
</div>

<div class="overlay hidden" id="overlay" role="dialog" aria-modal="true" aria-labelledby="tutorial-heading">
  <div class="tutorial">
    <h2 class="tutorial-title" id="tutorial-heading" data-i18n="tutorialTitle">How it works</h2>

    <div class="tutorial-rows">

      <div class="tutorial-row">
        <div class="demo-card demo-checked">
          <span class="demo-dot demo-dot-check">✓</span>
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action" data-i18n="action1">Tap once</span>
          <span class="row-result" data-i18n="result1">Mark as packed ✓</span>
        </div>
      </div>

      <div class="tutorial-row">
        <div class="demo-card demo-skipped">
          <span class="demo-dot demo-dot-skip">✕</span>
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action" data-i18n="action2">Tap again</span>
          <span class="row-result" data-i18n="result2">Not taking ✕</span>
        </div>
      </div>

      <div class="tutorial-row">
        <div class="demo-card">
          <span class="demo-emoji">🧳</span>
          <span class="demo-lbl">Item</span>
        </div>
        <div class="tutorial-row-text">
          <span class="row-action" data-i18n="action3">Tap once more</span>
          <span class="row-result" data-i18n="result3">Reset to default</span>
        </div>
      </div>

      <div class="tutorial-row">
        <div class="demo-plus" aria-hidden="true"></div>
        <div class="tutorial-row-text">
          <span class="row-action" data-i18n="action4">Tap +</span>
          <span class="row-result" data-i18n="result4">Add your own item</span>
        </div>
      </div>

    </div>

    <button class="tutorial-btn" id="tutorial-dismiss" data-i18n="dismiss">Got it</button>
  </div>
</div>

<script src="app.js"></script>
<script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
